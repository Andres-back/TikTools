<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- TikFinity-inspired branding -->
<title>TikTools | TikTok LIVE Tools</title>
<meta name="description" content="TikTools — Herramientas interactivas para TikTok LIVE. Subastas, overlays, sonidos, TTS, chatbot y más.">
<meta name="theme-color" content="#0e0e1a">

<link rel="icon" type="image/png" href="/assets/LOGOSINFONDO.png">

<!-- Fonts: Outfit + Exo 2 (TikFinity style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Exo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- FontAwesome 6 Free -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

<!-- Styles -->
<link rel="stylesheet" href="/app/css/variables.css">
<link rel="stylesheet" href="/app/css/layout.css">
<link rel="stylesheet" href="/app/css/components.css">
<link rel="stylesheet" href="/app/css/ux-polish.css">
<link rel="stylesheet" href="/assets/css/overlays.css">
</head>
<body>

<a href="#app-view" class="skip-link">Saltar al contenido</a>

<header class="app-header" role="banner">
  <div class="header-left">
    <button class="hamburger" id="sidebarToggle" aria-label="Menú">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="header-brand">
      <img src="/assets/LOGOSINFONDO.png" alt="TikTools" class="header-logo">
      <span class="header-brand-text">TikTools</span>
      <span class="header-brand-sub"><i class="fa-regular fa-circle-play" style="margin-right:4px;color:var(--color-primary);font-size:10px"></i>TikTok LIVE Tools</span>
    </div>
  </div>
  <div class="header-right">
    <span class="ws-indicator" id="wsIndicator" title="Estado WebSocket"></span>
    <button class="user-menu-btn" id="userMenuBtn">
      <i class="fa-regular fa-circle-user"></i>
      <span id="userNameDisplay">Cargando...</span>
    </button>
  </div>
</header>

<aside class="main-sidebar" id="mainSidebar" role="navigation" aria-label="Navegación principal">
  <div class="sidebar-brand">
    <img src="/assets/LOGOSINFONDO.png" alt="" class="sidebar-logo">
    <div>
      <div class="sidebar-brand-text">TikTools</div>
      <div class="sidebar-brand-sub">TikTok LIVE Tools</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-title">Live Studio</div>
    <a href="/app/dashboard" class="nav-item is-primary" data-route="/app/dashboard">
      <i class="fa-solid fa-gauge-high"></i> Dashboard
    </a>
    <a href="/app/hype-arena" class="nav-item is-primary" data-route="/app/hype-arena">
      <i class="fa-solid fa-fire"></i> Hype Arena
    </a>
    <a href="/app/overlays" class="nav-item is-primary" data-route="/app/overlays">
      <i class="fa-solid fa-layer-group"></i> Overlays
    </a>
    <a href="/app/actions" class="nav-item" data-route="/app/actions">
      <i class="fa-solid fa-bolt"></i> Acciones
    </a>

    <div class="nav-divider"></div>
    <div class="nav-section-title">Interacción</div>
    <a href="/app/auctions" class="nav-item" data-route="/app/auctions">
      <i class="fa-solid fa-gavel"></i> Subastas
    </a>
    <a href="/app/roulette" class="nav-item" data-route="/app/roulette">
      <i class="fa-solid fa-arrow-rotate-right"></i> Ruleta
    </a>
    <a href="/app/timers" class="nav-item" data-route="/app/timers">
      <i class="fa-solid fa-clock"></i> Timers
    </a>
    <a href="/app/goals" class="nav-item" data-route="/app/goals">
      <i class="fa-solid fa-bullseye"></i> Metas
    </a>

    <div class="nav-divider"></div>
    <div class="nav-section-title">Comunidad</div>
    <a href="/app/chat" class="nav-item" data-route="/app/chat">
      <i class="fa-solid fa-comment-dots"></i> Chat
    </a>
    <a href="/app/chatbot" class="nav-item" data-route="/app/chatbot">
      <i class="fa-solid fa-robot"></i> Chatbot
    </a>
    <a href="/app/songrequests" class="nav-item" data-route="/app/songrequests">
      <i class="fa-solid fa-music"></i> Canciones
    </a>
    <a href="/app/analytics" class="nav-item" data-route="/app/analytics">
      <i class="fa-solid fa-chart-line"></i> Analytics
    </a>

    <div class="nav-divider"></div>
    <div class="nav-section-title">Cuenta</div>
    <a href="/app/payments" class="nav-item" data-route="/app/payments">
      <i class="fa-solid fa-crown"></i> Plan
    </a>
    <a href="/app/profile" class="nav-item" data-route="/app/profile">
      <i class="fa-regular fa-user"></i> Perfil
    </a>
    <a href="/app/settings" class="nav-item" data-route="/app/settings">
      <i class="fa-solid fa-sliders"></i> Configuración
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/admin.html" id="adminLink" style="color:var(--text-muted)">Panel Admin</a>
    <a href="#" id="logoutLink" style="color:var(--color-danger)"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
    <div style="margin-top:8px;opacity:0.6">v2.0.0</div>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="app-main" id="app-view" tabindex="-1" role="main">
  <div class="app-loading" id="appLoading">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>
</main>

<script type="module" src="/app/js/app.js"></script>
</body>
</html>
