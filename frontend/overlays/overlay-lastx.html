<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Last X Overlay · TikToolStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/assets/js/overlay-runtime.js"></script>
  <style>
    :root { --accent:#25d9f2; --text:#ffffff; --font:'Outfit',sans-serif; --fade:260ms; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; font-family:var(--font); }
    body { display:flex; align-items:center; justify-content:flex-start; padding:clamp(8px,2vw,24px); }
    .lastx { display:flex; align-items:center; gap:clamp(9px,1.4vw,16px); min-width:min(92vw,250px); max-width:min(96vw,720px); padding:clamp(8px,1.2vw,14px) clamp(12px,1.8vw,20px); color:var(--text); opacity:0; transform:translateY(8px); transition:opacity var(--fade) ease,transform var(--fade) ease; }
    .lastx.visible { opacity:1; transform:none; }
    .lastx.glass { border:1px solid color-mix(in srgb,var(--accent) 35%,rgba(255,255,255,.14)); border-radius:clamp(12px,2vw,20px); background:linear-gradient(135deg,rgba(6,10,20,.86),rgba(12,17,31,.68)); box-shadow:0 16px 46px rgba(0,0,0,.34),0 0 28px color-mix(in srgb,var(--accent) 14%,transparent); backdrop-filter:blur(15px); }
    .lastx.neon { border-left:clamp(3px,.45vw,6px) solid var(--accent); border-radius:6px 18px 18px 6px; background:linear-gradient(90deg,rgba(5,8,15,.9),rgba(5,8,15,.46)); box-shadow:-5px 0 22px color-mix(in srgb,var(--accent) 38%,transparent); }
    .lastx.minimal { padding-left:0; background:transparent; text-shadow:0 2px 12px rgba(0,0,0,.9); }
    .avatar { width:clamp(44px,7vw,76px); height:clamp(44px,7vw,76px); flex:0 0 auto; overflow:hidden; border:2px solid color-mix(in srgb,var(--accent) 75%,white); border-radius:50%; background:linear-gradient(135deg,var(--accent),#7c3aed); box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent); }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .avatar-fallback { display:grid; place-items:center; width:100%; height:100%; color:white; font-size:clamp(18px,3vw,30px); font-weight:800; }
    .copy { min-width:0; }
    .label { display:block; margin-bottom:2px; color:var(--accent); font-size:clamp(9px,1.2vw,13px); font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .name { display:block; overflow:hidden; font-size:clamp(18px,3.2vw,38px); font-weight:800; letter-spacing:-.035em; line-height:1.05; text-overflow:ellipsis; white-space:nowrap; }
    .detail { display:block; overflow:hidden; max-width:520px; margin-top:3px; color:color-mix(in srgb,var(--text) 68%,transparent); font-size:clamp(9px,1.25vw,14px); text-overflow:ellipsis; white-space:nowrap; }
    body.align-center { justify-content:center; }
    body.align-right { justify-content:flex-end; }
    body.no-avatar .avatar { display:none; }
    body.no-label .label { display:none; }
    @media (max-aspect-ratio:3/4) {
      body { align-items:flex-start; padding:4vw; }
      .lastx { width:100%; max-width:none; min-width:0; padding:3vw 3.5vw; gap:3vw; }
      .avatar { width:14vw; height:14vw; }
      .label { font-size:2.7vw; }
      .name { font-size:5.5vw; }
      .detail { font-size:3vw; }
    }
    @media (prefers-reduced-motion:reduce) { .lastx { transition:none; } }
  </style>
</head>
<body>
  <main class="lastx glass" id="lastx" aria-live="polite">
    <div class="avatar"><img id="avatar" alt="" hidden><span class="avatar-fallback" id="fallback">T</span></div>
    <div class="copy"><span class="label" id="label">Último seguidor</span><strong class="name" id="name">Esperando actividad…</strong><span class="detail" id="detail"></span></div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const TYPES = {
        follower:{ event:'follow', label:'Último seguidor', demo:'@nuevo_seguidor', detail:'se unió a la comunidad' },
        gifter:{ event:'gift', label:'Último donante', demo:'@galaxy_fan', detail:'envió Galaxy · 1.000 coins' },
        subscriber:{ event:'subscribe', label:'Último suscriptor', demo:'@super_fan', detail:'se convirtió en Super Fan' },
        share:{ event:'share', label:'Último en compartir', demo:'@amigo_del_live', detail:'compartió la transmisión' },
        like:{ event:'like', label:'Último like', demo:'@tap_master', detail:'envió 25 likes' },
        chatter:{ event:'chat', label:'Último comentario', demo:'@chat_activo', detail:'¡Vamos por la meta!' }
      };
      const typeKey = TYPES[params.get('x')] ? params.get('x') : 'follower';
      const config = TYPES[typeKey];
      const root = document.getElementById('lastx');
      const avatar = document.getElementById('avatar');
      const fallback = document.getElementById('fallback');
      const name = document.getElementById('name');
      const detail = document.getElementById('detail');
      const label = document.getElementById('label');
      const safeColor = (value,fallbackValue) => /^#[0-9a-f]{6}$/i.test(value || '') ? value : fallbackValue;
      const accent = safeColor(`#${String(params.get('accent') || '').replace('#','')}`,'#25d9f2');
      const text = safeColor(`#${String(params.get('text') || '').replace('#','')}`,'#ffffff');
      const fontMap = { outfit:"'Outfit',sans-serif",inter:"'Inter',sans-serif",space:"'Space Grotesk',sans-serif" };
      const style = ['glass','minimal','neon'].includes(params.get('style')) ? params.get('style') : 'glass';
      const align = ['left','center','right'].includes(params.get('align')) ? params.get('align') : 'left';
      const fade = Math.min(1200,Math.max(0,Number(params.get('fade')) || 260));
      document.documentElement.style.setProperty('--accent',accent);
      document.documentElement.style.setProperty('--text',text);
      document.documentElement.style.setProperty('--font',fontMap[params.get('font')] || fontMap.outfit);
      document.documentElement.style.setProperty('--fade',`${fade}ms`);
      root.className = `lastx ${style}`;
      document.body.classList.add(`align-${align}`);
      if (params.get('avatar') === '0') document.body.classList.add('no-avatar');
      if (params.get('label') === '0') document.body.classList.add('no-label');
      label.textContent = config.label;

      const channelId = window.TikToolOverlay?.channelIdFromUrl?.() || params.get('userId') || '';
      const storageKey = `tiktool:lastx:${channelId}:${typeKey}`;
      const readSaved = () => { try { return JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch { return null; } };
      const save = (value) => { try { localStorage.setItem(storageKey,JSON.stringify(value)); } catch {} };

      function normalized(event = {}) {
        const displayName = event.nickname || event.uniqueId || 'Espectador';
        let secondary = config.detail;
        if (typeKey === 'gifter') secondary = `envió ${event.giftName || 'un regalo'}${event.coins ? ` · ${Number(event.coins).toLocaleString('es-CO')} coins` : ''}`;
        if (typeKey === 'like') secondary = `envió ${Number(event.likeCount || 1).toLocaleString('es-CO')} like${Number(event.likeCount || 1) === 1 ? '' : 's'}`;
        if (typeKey === 'chatter') secondary = event.comment || event.message || config.detail;
        if (typeKey === 'subscriber' && event.subMonth) secondary = `${event.subMonth} mes${event.subMonth === 1 ? '' : 'es'} apoyando el LIVE`;
        return { name:`@${String(displayName).replace(/^@/,'')}`, detail:secondary, avatar:event.profilePictureUrl || '' };
      }

      function render(value, animate = true) {
        if (!value) return;
        const apply = () => {
          name.textContent = value.name;
          detail.textContent = value.detail || '';
          fallback.textContent = String(value.name || 'T').replace('@','').charAt(0).toUpperCase();
          if (value.avatar) { avatar.src = value.avatar; avatar.hidden = false; fallback.hidden = true; }
          else { avatar.hidden = true; fallback.hidden = false; }
          root.classList.add('visible');
        };
        if (!animate || !root.classList.contains('visible')) return apply();
        if (window.gsap && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
          gsap.to(root,{ opacity:0,y:8,duration:fade/2000,onComplete:() => { apply(); gsap.fromTo(root,{opacity:0,y:8},{opacity:1,y:0,duration:fade/1000}); }});
        } else { root.classList.remove('visible'); setTimeout(apply,fade); }
      }

      avatar.addEventListener('error',() => { avatar.hidden = true; fallback.hidden = false; });
      const saved = readSaved();
      if (params.get('demo') === '1') render({ name:config.demo,detail:config.detail,avatar:'' },false);
      else if (saved) render(saved,false);
      else root.classList.add('visible');

      if (channelId && params.get('demo') !== '1' && window.TikToolOverlay?.LiveChannelClient) {
        const client = new window.TikToolOverlay.LiveChannelClient({ channelId });
        client.on(config.event,(event) => { const value = normalized(event); save(value); render(value,true); });
        client.start();
        addEventListener('beforeunload',() => client.stop(),{ once:true });
      }
    })();
  </script>
</body>
</html>
