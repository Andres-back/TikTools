<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent Events Overlay - TikToolStream</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/overlays.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: 'Poppins', system-ui, sans-serif; }

  .events-bar {
    position: fixed;
    top: 50%;
    right: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 320px;
    width: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .event-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(10,10,30,0.88), rgba(20,15,40,0.88));
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1.5px solid var(--event-color, rgba(0, 217, 255, 0.4));
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 24px var(--event-glow, rgba(0, 217, 255, 0.2));
    color: #fff;
    animation: eventIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: right center;
  }
  @keyframes eventIn {
    from { transform: translateX(120%) scale(0.9); opacity: 0; }
    to { transform: translateX(0) scale(1); opacity: 1; }
  }
  .event-card.fade { animation: eventOut 0.4s ease-out forwards; }
  @keyframes eventOut { to { transform: translateX(120%) scale(0.9); opacity: 0; } }

  .event-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--event-color, #00d9ff), var(--event-color-2, #7b2ff7));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
    box-shadow: 0 0 16px var(--event-glow, rgba(0, 217, 255, 0.4));
  }
  .event-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
  .event-body { flex: 1; min-width: 0; }
  .event-type {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--event-color, #00d9ff);
    font-weight: 700;
  }
  .event-user {
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 1px;
  }
  .event-detail {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-amount {
    background: linear-gradient(135deg, var(--event-color, #00d9ff), var(--event-color-2, #7b2ff7));
    color: #fff;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* Mobile portrait — horizontal bottom bar */
  .mobile .events-bar { top:auto; bottom:0; right:0; left:0; transform:none; flex-direction:row; max-width:100vw; width:100%; gap:6px; padding:4px 6px; overflow-x:auto; }
  .mobile .event-card { min-width:200px; flex-shrink:0; padding:8px 12px; gap:8px; transform-origin:bottom center; }
  .mobile .event-icon { width:32px; height:32px; font-size:1.1rem; }
  .mobile .event-user { font-size:0.8rem; }
  .mobile .event-detail { font-size:0.7rem; }
  .mobile .event-amount { font-size:0.7rem; padding:3px 7px; }
  @keyframes eventIn { from { transform:translateY(40px) scale(0.9); opacity:0; } to { transform:translateY(0) scale(1); opacity:1; } }
  .mobile .event-card.fade { animation:eventOut 0.3s ease-out forwards; }
  @keyframes eventOut { to { transform:translateY(40px) scale(0.9); opacity:0; } }
</style>
</head>
<body>
<div class="events-bar" id="eventsBar"></div>
<script>
  let ws = null;
  let reconnectTimer = null;
  const GIFT_IMAGES = {};
  const MAX_EVENTS = 5;
  const EVENT_DURATION = 6000;

  function getUserId() { return new URLSearchParams(window.location.search).get('userId'); }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;'); }

  const EVENT_THEMES = {
    gift:   { color: '#ffd700', color2: '#ff6b00', glow: 'rgba(255,215,0,0.4)', label: '🎁 Regalo', icon: '🎁' },
    follow: { color: '#00ff88', color2: '#00d9ff', glow: 'rgba(0,255,136,0.4)', label: '💚 Follow', icon: '👤' },
    share:  { color: '#00f5ff', color2: '#8b5cf6', glow: 'rgba(0,245,255,0.4)', label: '🔄 Share', icon: '🔁' },
    like:   { color: '#ff006e', color2: '#8b5cf6', glow: 'rgba(255,0,110,0.4)', label: '❤️ Like', icon: '❤️' },
    connect: { color: '#00f5ff', color2: '#7b2ff7', glow: 'rgba(123,47,247,0.4)', label: '🔗 Conectado', icon: '🔗' }
  };

  async function loadGiftCatalog() {
    try {
      const res = await fetch('/gifts.json');
      if (res.ok) {
        const data = await res.json();
        for (const g of Object.values(data)) if (g.id && g.image) GIFT_IMAGES[g.id] = g.image;
      }
    } catch {}
  }

  function addEvent(type, user, detail, amount, giftId, avatar) {
    const bar = document.getElementById('eventsBar');
    if (!bar) return;
    const theme = EVENT_THEMES[type] || EVENT_THEMES.gift;
    const giftImg = giftId ? GIFT_IMAGES[giftId] : null;
    const iconHtml = giftImg
      ? `<img src="${escapeAttr(giftImg)}" onerror="this.style.display='none';this.parentNode.textContent='${theme.icon}'">`
      : theme.icon;
    const div = document.createElement('div');
    div.className = 'event-card';
    div.style.setProperty('--event-color', theme.color);
    div.style.setProperty('--event-color-2', theme.color2);
    div.style.setProperty('--event-glow', theme.glow);
    div.innerHTML = `
      <div class="event-icon">${iconHtml}</div>
      <div class="event-body">
        <div class="event-type">${theme.label}</div>
        <div class="event-user">@${escapeHtml(user || 'anon')}</div>
        <div class="event-detail">${escapeHtml(detail || '')}</div>
      </div>
      ${amount ? `<div class="event-amount">+${amount.toLocaleString()} 💎</div>` : ''}
    `;
    bar.appendChild(div);
    while (bar.children.length > MAX_EVENTS) bar.removeChild(bar.firstChild);
    setTimeout(() => {
      div.classList.add('fade');
      setTimeout(() => div.remove(), 400);
    }, EVENT_DURATION);
  }

  function connectWS(userId) {
    if (ws) { try { ws.close(); } catch {} }
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    try {
      ws = new WebSocket(`${proto}//${window.location.host}/live`);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', channelId: userId }));
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          const data = msg.data || {};
          if (msg.type === 'gift') {
            const total = (data.diamondCount || 0) * (data.repeatCount || 1);
            addEvent('gift', data.uniqueId, data.giftName, total, data.giftId);
          } else if (msg.type === 'follow') {
            addEvent('follow', data.nickname || data.uniqueId, 'Nuevo follower 💚');
          } else if (msg.type === 'share') {
            addEvent('share', data.nickname || data.uniqueId, 'Compartió el live 🔄');
          } else if (msg.type === 'like') {
            addEvent('like', data.nickname || data.uniqueId, `Like #${data.likeCount || 1} ❤️`);
          } else if (msg.type === 'connected') {
            addEvent('connect', data.uniqueId, 'Stream conectado 🔗');
          }
        } catch {}
      };
      ws.onclose = () => { reconnectTimer = setTimeout(() => connectWS(userId), 3000); };
      ws.onerror = () => { try { ws.close(); } catch {} };
    } catch (e) { reconnectTimer = setTimeout(() => connectWS(userId), 3000); }
  }

  const isMobile = new URLSearchParams(window.location.search).get('mode') === 'mobile';
  if (isMobile) document.body.classList.add('mobile');

  const userId = getUserId();
  if (userId) {
    loadGiftCatalog();
    connectWS(userId);
  }
</script>
</body>
</html>
