<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer Count Overlay - TikToolStream</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/overlays.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: 'Poppins', system-ui, sans-serif; }

  .viewer-badge {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(10,10,30,0.92), rgba(20,15,40,0.92));
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    backdrop-filter: blur(24px) saturate(200%);
    border: 2px solid rgba(255, 23, 68, 0.5);
    border-radius: 16px;
    padding: 10px 18px 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 30px rgba(255, 23, 68, 0.3);
    pointer-events: none;
    z-index: 10;
  }
  .live-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ff1744;
    box-shadow: 0 0 12px #ff1744;
    animation: livePulse 1.5s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:0.5; transform:scale(1.3);} }
  .live-text {
    color: #ff1744;
    font-weight: 800;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
  }
  .viewer-icon {
    color: rgba(255,255,255,0.7);
    font-size: 1.2rem;
  }
  .viewer-count {
    color: #fff;
    font-weight: 800;
    font-family: 'Montserrat', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    min-width: 50px;
    text-align: right;
    background: linear-gradient(135deg, #fff, #00d9ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .viewer-label {
    color: rgba(255,255,255,0.5);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Mobile portrait */
  .mobile .viewer-badge { top:12px; left:50%; transform:translateX(-50%); padding:8px 14px 8px 10px; border-radius:12px; gap:8px; }
  .mobile .live-text { font-size:0.75rem; }
  .mobile .viewer-count { font-size:1.1rem; min-width:40px; }
  .mobile .live-dot { width:8px; height:8px; }
</style>
</head>
<body>
<div class="viewer-badge" id="viewerBadge">
  <span class="live-dot"></span>
  <span class="live-text">LIVE</span>
  <span class="viewer-icon">👁️</span>
  <div>
    <div class="viewer-count" id="viewerCount">0</div>
    <div class="viewer-label">viewers</div>
  </div>
</div>
<script>
  let ws = null;
  let reconnectTimer = null;
  let currentCount = 0;
  let targetCount = 0;
  let animFrame = null;

  function getUserId() { return new URLSearchParams(window.location.search).get('userId'); }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let animStart = 0, animStartVal = 0, duration = 1200;
  function animateCount() {
    animStart = performance.now();
    animStartVal = currentCount;
  }
  function tick(now) {
    if (currentCount !== targetCount) {
      if (!animStart) animStart = now;
      const k = Math.min(1, (now - animStart) / duration);
      const ease = 1 - Math.pow(1 - k, 3);
      currentCount = Math.round(animStartVal + (targetCount - animStartVal) * ease);
      const el = document.getElementById('viewerCount');
      if (el) el.textContent = currentCount.toLocaleString();
      if (k >= 1) animStart = 0;
    }
    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);

  function connectWS(userId) {
    if (ws) { try { ws.close(); } catch {} }
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    try {
      ws = new WebSocket(`${proto}//${window.location.host}/live`);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', channelId: userId }));
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'viewerCount' || msg.type === 'viewers') {
            const n = Number(msg.data?.count ?? msg.count) || 0;
            if (n !== targetCount) { targetCount = n; animateCount(); }
          } else if (msg.type === 'roomUser') {
            const n = Number(msg.data?.viewerCount) || 0;
            if (n !== targetCount) { targetCount = n; animateCount(); }
          }
        } catch {}
      };
      ws.onclose = () => { reconnectTimer = setTimeout(() => connectWS(userId), 3000); };
      ws.onerror = () => { try { ws.close(); } catch {} };
    } catch (e) { reconnectTimer = setTimeout(() => connectWS(userId), 3000); }
  }

  const isMobile = new URLSearchParams(window.location.search).get('mode') === 'mobile';
  if (isMobile) document.body.classList.add('mobile');

  const userId = getUserId();
  if (userId) connectWS(userId);
</script>
</body>
</html>
