<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Overlay - TikToolStream</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/overlays.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: 'Poppins', system-ui, sans-serif; }

  .chat-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 380px;
    max-width: 90vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    z-index: 10;
  }

  .chat-header {
    background: linear-gradient(135deg, rgba(10,10,30,0.92), rgba(20,15,40,0.92));
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(0, 217, 255, 0.3);
    border-radius: 0 0 16px 16px;
    padding: 12px 16px;
    color: #fff;
    font-weight: 700;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    position: relative;
  }
  .chat-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #00f5ff, transparent);
  }
  .chat-header .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: livePulse 1.5s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:0.4; transform:scale(1.3);} }
  .chat-header .count { font-size: 0.75rem; color: rgba(255,255,255,0.6); font-weight: 500; }

  .chat-stream {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    padding: 12px;
    pointer-events: auto;
  }
  .chat-stream::-webkit-scrollbar { width: 4px; }
  .chat-stream::-webkit-scrollbar-thumb { background: rgba(0, 217, 255, 0.3); border-radius: 2px; }

  .chat-msg {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    background: linear-gradient(135deg, rgba(0, 217, 255, 0.08), rgba(123, 47, 247, 0.04));
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 3px solid #00d9ff;
    border-radius: 10px;
    color: #fff;
    font-size: 0.85rem;
    animation: chatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    word-break: break-word;
  }
  .chat-msg.gift { border-left-color: #ffd700; background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 107, 0, 0.04)); }
  .chat-msg.follow { border-left-color: #00ff88; }
  .chat-msg.share { border-left-color: #00d9ff; }
  .chat-msg .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #00d9ff, #7b2ff7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; overflow: hidden; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.2); position:relative; }
  .chat-msg .avatar .avatar-letter { position:absolute; }
  .chat-msg .avatar .avatar-img { width: 100%; height: 100%; object-fit: cover; position:relative; z-index:1; }
  .chat-msg .body { flex: 1; min-width: 0; }
  .chat-msg .user { font-weight: 700; color: #00f5ff; font-size: 0.8rem; }
  .chat-msg .user.mod { color: #ff6b00; }
  .chat-msg .text { color: rgba(255,255,255,0.9); margin-top: 2px; }
  .chat-msg .amount { color: #ffd700; font-weight: 700; }
  @keyframes chatIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

  /* Mobile portrait — bottom sheet */
  .mobile .chat-overlay { top:auto; bottom:0; left:0; width:100vw; max-width:100vw; height:45vh; }
  .mobile .chat-header { border-radius:16px 16px 0 0; padding:10px 14px; }
  .mobile .chat-stream { padding:8px; gap:4px; }
  .mobile .chat-msg { font-size:0.75rem; padding:6px 8px; gap:6px; }
  .mobile .chat-msg .avatar { width:22px; height:22px; font-size:0.65rem; }
  .mobile .chat-msg .user { font-size:0.7rem; }
</style>
</head>
<body>
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-header">
    <span style="display:flex;align-items:center;gap:8px"><span class="pulse"></span>💬 Chat en vivo</span>
    <span class="count" id="chatCount">0 mensajes</span>
  </div>
  <div class="chat-stream" id="chatStream"></div>
</div>
<script>
  let ws = null;
  let reconnectTimer = null;
  let retryDelay = 1000;
  let messageCount = 0;
  const MAX_MESSAGES = 30;

  function getUserId() { return new URLSearchParams(window.location.search).get('userId'); }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;'); }

  function addMessage(msg) {
    const stream = document.getElementById('chatStream');
    if (!stream) return;
    messageCount++;
    document.getElementById('chatCount').textContent = `${messageCount} mensajes`;

    const isMod = msg.isMod || (msg.role === 'mod') || (msg.uniqueId || '').toLowerCase() === 'admin';
    const user = msg.user || '?';
    const initial = user.charAt(0).toUpperCase();
    const avatarHtml = `<span class="avatar-letter" style="display:none">${initial}</span>` + (msg.avatar
      ? `<img src="${escapeAttr(msg.avatar)}" onerror="this.previousElementSibling.style.display='';this.style.display='none'" class="avatar-img">`
      : '');

    const div = document.createElement('div');
    div.className = `chat-msg ${msg.type || ''}`;
    div.style.animationDelay = '0s';
    div.innerHTML = `
      <div class="avatar">${avatarHtml}</div>
      <div class="body">
        <div class="user ${isMod ? 'mod' : ''}">@${escapeHtml(user)}</div>
        <div class="text">${escapeHtml(msg.text || '')}${msg.amount ? ` <span class="amount">+${msg.amount.toLocaleString()} 💎</span>` : ''}</div>
      </div>
    `;
    stream.appendChild(div);

    /* keep only last N */
    while (stream.children.length > MAX_MESSAGES) {
      stream.removeChild(stream.firstChild);
    }

    /* auto-scroll if at bottom */
    requestAnimationFrame(() => { stream.scrollTop = stream.scrollHeight; });
  }

  function connectWS(userId) {
    if (ws) { try { ws.close(); } catch {} }
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    try {
      ws = new WebSocket(`${proto}//${window.location.host}/live`);
      ws.onopen = () => {
        retryDelay = 1000;
        ws.send(JSON.stringify({ type: 'subscribe', channelId: userId }));
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          const data = msg.data || {};
          if (msg.type === 'chat' || msg.type === 'comment') {
            addMessage({ type: '', user: data.nickname || data.uniqueId, text: data.comment || data.message, avatar: data.profilePictureUrl });
          } else if (msg.type === 'gift') {
            const total = (data.diamondCount || 0) * (data.repeatCount || 1);
            addMessage({ type: 'gift', user: data.uniqueId, text: `envió ${data.giftName || 'regalo'}`, amount: total, avatar: data.profilePictureUrl });
          } else if (msg.type === 'follow') {
            addMessage({ type: 'follow', user: data.nickname || data.uniqueId, text: 'empezó a seguirte 💚' });
          } else if (msg.type === 'share') {
            addMessage({ type: 'share', user: data.nickname || data.uniqueId, text: 'compartió el live 🔄' });
          }
        } catch (e) { console.warn('[Chat] msg parse:', e); }
      };
      ws.onclose = () => { reconnectTimer = setTimeout(() => connectWS(userId), Math.min(retryDelay, 30000)); retryDelay *= 2; };
      ws.onerror = () => { try { ws.close(); } catch {} };
    } catch (e) { reconnectTimer = setTimeout(() => connectWS(userId), 3000); }
  }

  const isMobile = new URLSearchParams(window.location.search).get('mode') === 'mobile';
  if (isMobile) document.body.classList.add('mobile');

  const userId = getUserId();
  if (userId) connectWS(userId);
</script>
</body>
</html>
